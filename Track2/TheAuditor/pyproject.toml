# TheAuditor — tooling configuration.
#
# DELIBERATELY NOT AN INSTALLABLE PACKAGE. There is no [build-system] and no
# `pip install -e .`.
#
# Why: with a flat src/, the importable names would be `schemas`, `verify`,
# `console`, `linker` — generic enough to collide with something else in the
# ROCm image. Installing them globally to get an import path is a bad trade for
# a two-week project. Putting `src` on the path instead costs one line here for
# tests, and one environment variable for scripts, and pollutes nothing.
#
#   Dependencies:   pip install -r requirements.txt
#   Tests:          python -m pytest          (from Track2/TheAuditor)
#   Scripts:        $env:PYTHONPATH = "src"   (PowerShell, once per session)
#                   export PYTHONPATH=src     (bash, on the Radeon instance)

[tool.pytest.ini_options]
testpaths = ["tests"]
# src/       -> schemas, precision, verify, linker, harmonize, extraction, console
# generator/ -> gen  (the generator PRODUCES data and is not part of the agent,
#               so it lives with the data rather than in src/)
pythonpath = ["src", "data/generator"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 88
target-version = "py310"
